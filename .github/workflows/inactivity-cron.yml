name: Daily Inactivity Check

on:
  schedule:
    # Runs every day at 10:00 AM IST (04:30 UTC)
    - cron: '30 04 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  run-inactivity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Inactivity Cron Job
        id: cron
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://contest-tracker-zms3.vercel.app/api/cron/inactivity-check)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Cron job failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Check if the response indicates success
          if echo "$BODY" | grep -q '"success":false'; then
            echo "Cron job returned failure"
            exit 1
          fi

          echo "Cron job completed successfully"

      - name: Log Result
        if: always()
        run: echo "Email cron trigger finished at $(date) with status ${{ steps.cron.outcome }}"

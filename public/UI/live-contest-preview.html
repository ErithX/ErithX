<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Contest Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .live-pulse::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background-color: inherit;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#09090b] text-white min-h-screen flex items-center justify-center p-6 font-sans">

    <!-- Live Contest Card Wrapper -->
    <div class="rounded-xl border border-white/5 bg-[#0e0e11] relative overflow-hidden shrink-0 w-full max-w-[500px]">
        
        <!-- Live Gradient Background Overlay -->
        <div class="absolute inset-0 z-0">
            <div class="absolute top-0 right-0 w-48 h-48 bg-red-500/10 rounded-full filter blur-3xl opacity-50 translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 left-0 w-32 h-32 bg-orange-500/10 rounded-full filter blur-2xl opacity-30 -translate-x-1/2 translate-y-1/2"></div>
        </div>

        <div class="relative z-10 p-5 md:p-6 flex flex-col h-full">
            <!-- Header Row -->
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center p-2 shrink-0 relative">
                        <img src="https://cdn.simpleicons.org/leetcode/white" alt="LeetCode" class="w-full h-full object-contain" />
                        <div class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-red-500 live-pulse"></div>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-medium text-zinc-400">LeetCode</span>
                        </div>
                        <h3 class="text-base md:text-lg font-bold text-zinc-100 leading-tight line-clamp-1">Biweekly Contest 124</h3>
                    </div>
                </div>
                
                <div class="shrink-0 flex items-center">
                    <div class="px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider bg-red-500/10 text-red-500 border border-red-500/20 flex items-center gap-1">
                        <i data-lucide="radio" class="w-3 h-3"></i> LIVE NOW
                    </div>
                </div>
            </div>

            <!-- Active Timer Area -->
            <div class="my-4 py-4 md:py-6 border-y border-white/5 flex flex-col items-center justify-center relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-red-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
                <div class="text-[10px] uppercase tracking-widest text-zinc-500 mb-3 font-semibold">Ends In</div>
                
                <!-- Timer Display -->
                <div class="flex items-start justify-center gap-2">
                    <div class="flex flex-col items-center">
                        <span class="text-3xl md:text-4xl font-bold text-zinc-100 tracking-wider">01</span>
                        <span class="text-[9px] text-zinc-500 font-medium mt-0.5">HR</span>
                    </div>
                    <span class="text-2xl md:text-3xl font-bold text-zinc-600 mt-[-5px] px-1">:</span>
                    <div class="flex flex-col items-center">
                        <span class="text-3xl md:text-4xl font-bold text-zinc-100 tracking-wider">28</span>
                        <span class="text-[9px] text-zinc-500 font-medium mt-0.5">MIN</span>
                    </div>
                    <span class="text-2xl md:text-3xl font-bold text-zinc-600 mt-[-5px] px-1">:</span>
                    <div class="flex flex-col items-center">
                        <span class="text-3xl md:text-4xl font-bold text-zinc-100 tracking-wider text-red-400 animate-pulse">45</span>
                        <span class="text-[9px] text-zinc-500 font-medium mt-0.5">SEC</span>
                    </div>
                </div>
            </div>

            <div class="mt-auto">
                <div class="flex items-center gap-3 mb-5">
                    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-zinc-800/50 text-[11px] text-zinc-300 font-medium border border-white/5">
                        <i data-lucide="bar-chart" class="w-3.5 h-3.5 text-orange-400"></i> Intermediate
                    </div>
                    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-zinc-800/50 text-[11px] text-zinc-300 font-medium border border-white/5">
                        <i data-lucide="users" class="w-3.5 h-3.5 text-blue-400"></i> 14.5K
                    </div>
                    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-zinc-800/50 text-[11px] text-zinc-300 font-medium border border-white/5">
                        <i data-lucide="flame" class="w-3.5 h-3.5 text-rose-400"></i> Hot
                    </div>
                </div>
                
                <a href="#" class="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white text-sm font-bold transition-all shadow-[0_0_15px_rgba(220,38,38,0.3)]">
                    Participate Now <i data-lucide="external-link" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // Simple JS timer logic for the preview
        let seconds = 45;
        let mins = 28;
        let hrs = 1;
        
        setInterval(() => {
            seconds--;
            if (seconds < 0) {
                seconds = 59;
                mins--;
                if (mins < 0) {
                    mins = 59;
                    hrs--;
                }
            }
            // Update SEC
            document.querySelector('.text-red-400').textContent = seconds.toString().padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
